[package]
name = "lightcraft-video"
description = "MP4 / QuickTime video for LightCraft: probe, poster image and frames (a thin, panic-guarded wrapper around FilmCraft's clean-room demuxer and decoders, plus Motion JPEG)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# H.265 / HEVC clips (most iPhone video). Optional for the reason `lightcraft-heif` is: HEVC is
# patent-encumbered in some jurisdictions, so including a decoder is a distributor's choice.
hevc = ["dep:filmcraft-hevc"]
# Generated test clips (`lightcraft_video::testkit`): an H.264 and a JPEG encoder, for tests only.
# Crates that test with video enable it on their dev-dependency; no product build does.
testkit = ["dep:filmcraft-h264enc", "dep:jpeg-encoder"]

[dependencies]
filmcraft-isobmff = { workspace = true }
filmcraft-h264 = { workspace = true }
filmcraft-hevc = { workspace = true, optional = true }
filmcraft-h264enc = { workspace = true, optional = true }
# the sound: AAC (uncompressed PCM is read directly)
filmcraft-aac = { workspace = true }
# Motion JPEG: every frame is a JPEG picture
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
jpeg-encoder = { workspace = true, optional = true }

# Frames decode on several threads on native; wasm stays single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
filmcraft-h264 = { workspace = true, features = ["threads"] }
filmcraft-hevc = { workspace = true, optional = true, features = ["threads"] }

[dev-dependencies]
# this crate's own tests use its generated clips
lightcraft-video = { path = ".", features = ["testkit"] }

[lints]
workspace = true
